server {
    listen 80;
    server_name pandanet.grupopixel.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pandanet.grupopixel.com.br;

    ssl_certificate /etc/letsencrypt/live/pandanet.grupopixel.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pandanet.grupopixel.com.br/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/email/ {
        proxy_pass http://host.docker.internal:3001/api/email/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /auth/v1/ {
        proxy_pass http://supabase-kong:8000/auth/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /rest/v1/ {
        proxy_pass http://supabase-kong:8000/rest/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /storage/v1/ {
        proxy_pass http://supabase-kong:8000/storage/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /realtime/v1/ {
        proxy_pass http://supabase-kong:8000/realtime/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
