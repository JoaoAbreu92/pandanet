server {
    listen 80;
    server_name pandanet.grupopixel.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pandanet.grupopixel.com.br;
    client_max_body_size 100M;
    client_body_buffer_size 1M;

    # Permitir uploads maiores (Storage Supabase)

    ssl_certificate /etc/letsencrypt/live/pandanet.grupopixel.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pandanet.grupopixel.com.br/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/email/ {
    proxy_pass http://pandanet_email:3001/api/email/;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_read_timeout 120s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 120s;

    proxy_buffering on;
    proxy_buffer_size 64k;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;

}

    location /api/ {
        proxy_pass http://pandanet_backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
    }

    location /auth/v1/ {
        proxy_pass http://supabase-kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /rest/v1/ {
        proxy_pass http://supabase-kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /storage/v1/ {
        proxy_pass http://supabase-kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /realtime/v1/ {
        proxy_pass http://supabase-kong:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}

