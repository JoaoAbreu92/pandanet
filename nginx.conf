server {
    listen 80;
    server_name pandanet.grupopixel.com.br;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy para o Backend ( /api )
    # Ajuste conforme suas rotas do express
    # Proxy para o Backend ( /api )
    # A barra no final do proxy_pass remove o /api da URL enviada ao backend
    location /api/ {
        proxy_pass http://whatsapp-backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
