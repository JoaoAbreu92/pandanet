version: '3.8'

services:
  # ============================================
  # Backend WhatsApp
  # ============================================
  whatsapp-backend:
    container_name: pandanet_backend
    build: 
      context: ./whatsapp-backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - SUPABASE_URL=http://supabase-kong:8000
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=EvolutionPandaSecret123
    networks:
      - pandanet_network
      - supabase_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Email Server (IMAP/SMTP Node.js)
  # ============================================
  email-server:
    container_name: pandanet_email
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - SUPABASE_URL=http://supabase-kong:8000
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SERVICE_ROLE_KEY=${SUPABASE_SERVICE_KEY}
    networks:
      - pandanet_network
      - supabase_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Frontend PandaNet
  # ============================================
  pandanet-frontend:
    container_name: pandanet_frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      whatsapp-backend:
        condition: service_healthy
      email-server:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - pandanet_network
      - supabase_default
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Evolution API (WhatsApp)
  # ============================================
  evolution-api:
    image: evoapicloud/evolution-api:v1.8.7
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://evolution-api:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=EvolutionPandaSecret123
      - LOG_LEVEL=ERROR,WARN
    networks:
      - pandanet_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

# ============================================
# Redes
# ============================================
networks:
  pandanet_network:
    driver: bridge
  supabase_default:
    external: true

# ============================================
# Volumes
# ============================================
volumes:
  certbot_conf:
  certbot_www:
  evolution_instances:
  evolution_store:
